# ==============================================================================
# 網站主設定 (Site Configuration)
# 完整文件：https://blowfish.page/docs/getting-started/
# ==============================================================================

theme = "blowfish"
baseURL = "https://blog.init.engineer"
title = "我不會寫程式"
languageCode = "zh-tw"
defaultContentLanguage = "zh-tw"

# 繁體中文為預設語言，不在 URL 加語言前綴（/en/、/ja/、/zh-cn/ 才有前綴）
defaultContentLanguageInSubDir = false

# 多語言：允許所有語言、缺少翻譯時直接忽略（不顯示 placeholder）
disableLanguages = []
enableMissingTranslationPlaceholders = false

enableRobotsTXT = false

# summaryLength = 0 停用自動摘要截斷，改由文章自行在 Front Matter 設定 summary
summaryLength = 0

buildDrafts = false
buildFuture = false

enableEmoji = true

googleAnalytics = "G-SJ3TX4G2LB"

# Hugo 渲染超時，部分含大量圖片的頁面（如 kemono）需較長時間
timeout = "300s"

# 文章永久連結格式：/posts/<slug>/
[permalinks]
  posts = "/posts/:slug/"

# 每頁顯示 10 篇文章
[pagination]
  pagerSize = 10

# 圖片處理：lanczos 重新取樣品質最佳，壓縮至 75% 平衡畫質與檔案大小
[imaging]
  resampleFilter = "lanczos"
  quality = 75
  anchor = "smart"

# 分類法：標籤、分類、作者、系列
[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

# 首頁同時輸出 HTML、RSS、JSON（JSON 供搜尋功能使用）
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 相關文章權重：tags/categories 最重要，series 次之，作者與日期做補充
[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10

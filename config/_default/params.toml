# ==============================================================================
# Blowfish 主題參數 (Theme Parameters)
# 完整文件：https://blowfish.page/docs/configuration/#theme-parameters
# ==============================================================================

# 色彩方案與外觀
colorScheme = "blowfish"
defaultAppearance = "dark"   # 預設深色模式，符合技術部落格的閱讀偏好
autoSwitchAppearance = true  # 允許依系統設定自動切換深淺色

# 功能開關
enableA11y = false           # 停用無障礙工具列（本站已自行處理 ARIA 標籤）
enableSearch = true          # 啟用站內搜尋（使用 Fuse.js）
enableCodeCopy = false       # 停用程式碼複製按鈕（避免與 Blowfish 主題的功能衝突）
disableImageZoom = true      # 停用主題全站圖片縮放，改由專案層級按頁面條件載入

replyByEmail = false

# 主要內容區段：只有 posts 目錄被當作「文章」
mainSections = ["posts"]

# 圖片最佳化：啟用，讓 Hugo 自動產生 WebP 與縮圖
disableImageOptimization = false
disableImageOptimizationMD = false
disableTextInHeader = false

# 高亮當前選單項目、啟用智慧 TOC（自動收合非焦點子項）
highlightCurrentMenuArea = false  # 改由自訂原生 JavaScript 處理，避免為選單高亮全站載入 jQuery
smartTOC = true
smartTOCHideUnfocusedChildren = true

# 靜態資源指紋：使用 SHA-512 確保快取一致性
fingerprintAlgorithm = "sha512"

giteaDefaultServer = "https://git.fsfe.org"
forgejoDefaultServer = "https://v11.next.forgejo.org"

# -- 版面配置 --

[header]
  layout = "fixed"  # 固定式導覽列，捲動時始終可見

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "background"       # 首頁使用全螢幕背景影片佈局
  homepageImage = "img/kemono/after/background.mp4"  # 獸設角色動態背景
  showRecent = false           # 首頁不顯示最近文章（透過自訂 partial 控制）
  showRecentItems = 6
  showMoreLink = true
  showMoreLinkDest = "/posts/"
  cardView = false
  cardViewScreenWidth = false
  layoutBackgroundBlur = true  # 背景模糊效果
  disableHeroImageFilter = false

[article]
  showDate = true
  showViews = false
  showLikes = false
  showDateOnlyInArticle = false
  showDateUpdated = false
  showAuthor = true
  showHero = true
  heroStyle = "thumbAndBackground"  # 文章頂部顯示縮圖與背景疊加
  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = true
  showBreadcrumbs = false
  showDraftLabel = true
  showEdit = false
  editAppendPath = true
  seriesOpened = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  showTaxonomies = true
  showCategoryOnly = false
  showAuthorsBadges = false
  showWordCount = true
  showZenMode = false

[list]
  showHero = true
  heroStyle = "basic"
  layoutBackgroundBlur = false
  layoutBackgroundHeaderSpace = false
  showBreadcrumbs = true
  showSummary = true
  showViews = false
  showLikes = false
  showTableOfContents = false
  showCards = false
  orderByWeight = false
  groupByYear = true           # 文章列表依年份分組顯示
  cardView = false
  cardViewScreenWidth = false
  constrainItemsWidth = false

[sitemap]
  excludedKinds = ["taxonomy", "term"]  # Sitemap 排除分類頁，減少爬蟲負擔

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  cardView = false

[term]
  showHero = false
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = true
  groupByYear = true
  cardView = false
  cardViewScreenWidth = false

# -- 以下為未使用的第三方服務設定，保留供日後啟用 --

[firebase]
[fathomAnalytics]
[umamiAnalytics]
[selineAnalytics]
[buymeacoffee]
[verification]
[rssnext]
[advertisement]

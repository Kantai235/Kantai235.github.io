"$schema" = "./node_modules/wrangler/config-schema.json"

name = "blog-init-engineer-agent-edge"
main = "./edge/agent-ready-proxy.mjs"
compatibility_date = "2026-04-22"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "blog.init.engineer/*"
zone_name = "init.engineer"


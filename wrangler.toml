"$schema" = "./node_modules/wrangler/config-schema.json"

name = "blog-init-engineer-agent-edge"
main = "./edge/agent-ready-proxy.mjs"
compatibility_date = "2026-04-22"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[env.production]
workers_dev = false

  [env.production.assets]
  directory = "./public"
  binding = "ASSETS"
  run_worker_first = true

  [[env.production.routes]]
  pattern = "blog.init.engineer"
  custom_domain = true

<!--
  自訂短代碼：kemono-interface
  功能說明：Kemono（獸設）頁面的互動介面，統一管理標籤頁（Tab）切換
  與創作者資訊的顯示邏輯。用於獸設前後對比、作品展示等區塊的切換。
-->
{{/*
  Kemono 互動介面 shortcode
  統一管理 Tab 切換和創作者資訊功能
  JS 邏輯已提取至 assets/js/shortcodes/kemono-interface.js

  使用方式：
  {{< kemono-interface >}}
*/}}

<!-- 創作者資訊提示 -->
<div id="creator-toast" class="creator-toast">
  <div class="creator-info">
    {{ partial "icon.html" (dict "icon" "pencil") }}
    <div class="creator-text" id="creator-text"></div>
  </div>
</div>

<!-- i18n 字串注入（供外部 JS 使用） -->
<script>
window.kemonoI18n = {
    loading: {{ i18n "kemono.loading" | jsonify | safeJS }},
    creatorLabel: {{ i18n "kemono.creator_label" | jsonify | safeJS }}
};
</script>
